spring.application.name=jobprocessor
server.port=8085

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.datasource.url=jdbc:postgresql://postgres:5432/jobdb
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.rabbitmq.listener.simple.acknowledge-mode=manual
# Logging Configuration

logging.level.root=INFO
logging.level.com.example.jobprocessor=DEBUG
logging.level.org.hibernate=ERROR

# Clean Log Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n

# Disable Hibernate SQL logs
spring.jpa.show-sql=false

# Redis Configuration
spring.data.redis.host=redis
spring.data.redis.port=6379

# Enable Cache
spring.cache.type=redis
# RabbitMQ Concurrent Consumers
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=5
# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics

# Show full health details
management.endpoint.health.show-details=always

# Enable health probes
management.health.rabbit.enabled=true
management.health.redis.enabled=true
management.health.db.enabled=true

# Application Info
management.info.env.enabled=true

info.app.name=Job Processing System
info.app.version=1.0.0
info.app.description=Distributed Job Processing Backend using Spring Boot, RabbitMQ, Redis and PostgreSQL
